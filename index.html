<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>東海道五十三次 GPS記録</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-area" aria-label="東海道五十三次の地図">
        <div id="map"></div>
        <div class="map-tools" aria-label="地図操作">
          <button id="fitRouteButton" type="button" title="五十三次全体を表示">全体</button>
          <button id="locateButton" type="button" title="現在地へ移動">現在地</button>
        </div>
      </section>

      <aside class="panel" aria-label="歩行記録">
        <header class="panel-header">
          <p class="eyebrow">Tokaido Walk Log</p>
          <h1>東海道五十三次</h1>
          <p class="subtitle">日本橋から三条大橋まで、歩いた軌跡を少しずつ重ねていく記録帳。</p>
        </header>

        <section class="status-grid" aria-label="現在の状態">
          <div>
            <span>現在区間</span>
            <strong id="nearestStage">未計測</strong>
          </div>
          <div>
            <span>記録距離</span>
            <strong id="trackDistance">0.00 km</strong>
          </div>
          <div>
            <span>記録点</span>
            <strong id="pointCount">0</strong>
          </div>
          <div>
            <span>精度</span>
            <strong id="accuracy">-</strong>
          </div>
        </section>

        <section class="controls" aria-label="GPS記録操作">
          <button id="startButton" class="primary" type="button">記録開始</button>
          <button id="stopButton" type="button" disabled>停止</button>
          <button id="clearButton" type="button">記録クリア</button>
        </section>

        <section class="exports" aria-label="データ書き出し">
          <button id="exportGpxButton" type="button">GPXを書き出し</button>
          <button id="exportJsonButton" type="button">JSONを書き出し</button>
        </section>

        <section class="log-form" aria-label="歩行メモ">
          <label>
            今日のメモ
            <textarea id="walkMemo" rows="4" placeholder="例: 箱根旧街道の石畳。雨上がりで足元注意。"></textarea>
          </label>
          <button id="saveMemoButton" type="button">メモ保存</button>
        </section>

        <section class="station-list" aria-label="宿場一覧">
          <h2>宿場</h2>
          <ol id="stations"></ol>
        </section>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
